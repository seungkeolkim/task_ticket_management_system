{% extends "auth_base.html" %}

{% block auth_content %}
<div class="auth-form-wrap">
  <a class="text-link back-link" href="/">← 내 작업으로 돌아가기</a>
  <div class="auth-heading">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h2>새 비밀번호 설정</h2>
    <p>초기 비밀번호를 변경해야 계속 사용할 수 있습니다.</p>
  </div>
  <div class="step-indicator"><span class="is-done">1</span><i></i><span class="is-current">2</span></div>
  <form class="auth-form" action="/" method="get">
    <label class="field">
      <span>현재 비밀번호</span>
      <input type="password" value="mock-password">
    </label>
    <label class="field">
      <span>새 비밀번호</span>
      <input type="password" placeholder="새 비밀번호 입력">
      <small>12자 이상, 영문·숫자·특수문자를 조합하세요.</small>
    </label>
    <label class="field">
      <span>새 비밀번호 확인</span>
      <input type="password" placeholder="한 번 더 입력">
    </label>
    <button class="button primary button-wide" type="submit">변경하고 계속</button>
  </form>
</div>
{% endblock %}
