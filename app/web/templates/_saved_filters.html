<section class="saved-filter-panel" data-saved-filters data-project-key="{{ project.key }}" data-csrf-token="{{ csrf_token }}" data-can-manage-shared="{{ 'true' if project.can_manage and project.is_active else 'false' }}" data-view="{{ 'board' if is_board_filter else 'tickets' }}" aria-label="저장 필터">
  <div class="saved-filter-toolbar">
    <label for="saved-filter-selection">저장 필터 불러오기</label>
    <select id="saved-filter-selection" data-saved-filter-selection>
      <option value="">필터 선택</option>
      <optgroup label="내 개인 필터 · 나만 보기">{% for saved_filter in personal_filters %}<option value="personal:{{ saved_filter.id }}" data-updated-at="{{ saved_filter.updated_at.isoformat() }}" {% if request.query_params.get('loaded_scope') == 'personal' and request.query_params.get('loaded_id') == saved_filter.id|string %}selected{% endif %}>{{ saved_filter.name }}</option>{% endfor %}</optgroup>
      <optgroup label="프로젝트 공유 필터 · 구성원 공용">{% for saved_filter in shared_filters %}<option value="shared:{{ saved_filter.id }}" data-updated-at="{{ saved_filter.updated_at.isoformat() }}" {% if request.query_params.get('loaded_scope') == 'shared' and request.query_params.get('loaded_id') == saved_filter.id|string %}selected{% endif %}>{{ saved_filter.name }}</option>{% endfor %}</optgroup>
    </select>
    <button class="button secondary" type="button" data-saved-filter-action="load">불러오기</button>
    <button class="button secondary" type="button" data-saved-filter-action="create">필터 저장</button>
    <button class="button quiet" type="button" data-saved-filter-action="rename" hidden>이름 변경</button>
    <button class="button quiet" type="button" data-saved-filter-action="overwrite" hidden>현재 조건으로 덮어쓰기</button>
    <button class="button quiet" type="button" data-saved-filter-action="delete" hidden>삭제</button>
  </div>
  <p class="saved-filter-description" data-saved-filter-description>마지막으로 적용한 조건·정렬·표시 개수를 저장합니다. 공유 필터는 프로젝트 관리자가 관리합니다.</p>
  <div class="auth-message" data-saved-filter-feedback role="status" aria-live="polite" hidden></div>
  <dialog data-saved-filter-dialog aria-labelledby="saved-filter-dialog-title">
    <form data-saved-filter-create>
      <h2 id="saved-filter-dialog-title">필터 저장</h2>
      <label for="saved-filter-name">필터 이름</label><input id="saved-filter-name" name="name" maxlength="200" required autocomplete="off">
      <label for="saved-filter-scope">공개 범위</label><select id="saved-filter-scope" name="scope"><option value="personal">내 개인 필터 · 나만 보기</option>{% if project.can_manage and project.is_active %}<option value="shared">프로젝트 공유 필터 · 구성원 공용</option>{% endif %}</select>
      <p>‘적용’으로 반영한 현재 조건을 저장합니다.</p>
      <button class="button primary" type="submit">저장</button><button class="button quiet" type="button" data-saved-filter-cancel>취소</button>
    </form>
  </dialog>
  <script type="application/json" data-applied-ticket-filter>{{ filters.model_dump(mode='json')|tojson }}</script>
</section>
<link rel="stylesheet" href="{{ url_for('static', path='saved-filters.css') }}">
<script src="{{ url_for('static', path='saved-filters.js') }}" defer></script>
