<form class="ticket-filter-editor" action="{{ filter_action }}" method="get" data-ticket-filter-editor>
  <input type="hidden" name="filter" value="{{ filters.model_dump_json() }}" data-filter-payload>
  {% for metadata_name in ['loaded_scope', 'loaded_id'] %}
  {% if request.query_params.get(metadata_name) %}<input type="hidden" name="{{ metadata_name }}" value="{{ request.query_params.get(metadata_name) }}">{% endif %}
  {% endfor %}
  <div data-filter-expression></div>
  <p class="filter-applied-resolution" data-filter-applied-resolution role="status"></p>
  <div class="ticket-filter-footer">
    {% if not is_board_filter %}
    <label>정렬<select data-filter-sort>{% for value, label in [('updated_at','수정일'),('created_at','생성일'),('due_date','마감일'),('priority','중요도'),('number','티켓 번호')] %}<option value="{{ value }}" {% if filters.sort_by == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label>방향<select data-filter-direction><option value="desc" {% if filters.sort_direction == 'desc' %}selected{% endif %}>내림차순</option><option value="asc" {% if filters.sort_direction == 'asc' %}selected{% endif %}>오름차순</option></select></label>
    <label>표시<select data-filter-page-size>{% for size in [10,20,50] %}<option value="{{ size }}" {% if filters.page_size == size %}selected{% endif %}>{{ size }}개</option>{% endfor %}</select></label>
    {% endif %}
    <button class="button primary" type="submit">적용</button>
    <a class="button quiet" href="{{ filter_action }}">초기화</a>
    <span data-filter-dirty role="status" aria-live="polite" hidden>편집한 조건이 아직 적용되지 않았습니다.</span>
  </div>
  <div class="auth-message error" data-filter-error role="alert" hidden></div>
  <details class="ticket-filter-summary"><summary>조건 요약</summary><p data-filter-summary></p></details>
  <noscript>조건 편집과 적용에는 JavaScript가 필요합니다.</noscript>
  <script type="application/json" data-filter-definition>{{ filters.model_dump(mode='json')|tojson }}</script>
  <script type="application/json" data-filter-options>{{ filter_options.model_dump(mode='json')|tojson }}</script>
  <script type="application/json" data-filter-resolution>{{ (board.filter_resolution if is_board_filter else result.filter_resolution).model_dump(mode='json')|tojson }}</script>
</form>
<link rel="stylesheet" href="{{ url_for('static', path='ticket-filters.css') }}">
<script src="{{ url_for('static', path='ticket-filters.js') }}" defer></script>
