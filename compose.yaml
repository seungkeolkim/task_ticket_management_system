name: task-ticket-management-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-runtime
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:?Run run_compose.sh or run_compose.ps1 start}:${APP_PORT:?Run run_compose.sh or run_compose.ps1 start}"
    environment:
      APP_CONFIG_FILE: "/app/config/application.toml"
      APP_DATA_ROOT: "/app/data"
      TTMS__SERVER__PORT: "${APP_PORT:?Run run_compose.sh or run_compose.ps1 start}"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./data:/app/data
      - "${HOST_CONFIG_FILE:?Run run_compose.sh or run_compose.ps1 start}:/app/config/application.toml:ro"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; port = os.environ['TTMS__SERVER__PORT']; urllib.request.urlopen(f'http://127.0.0.1:{port}/health/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler-runtime
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_CONFIG_FILE: "/app/config/application.toml"
      APP_DATA_ROOT: "/app/data"
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data
      - "${HOST_CONFIG_FILE:?Run run_compose.sh or run_compose.ps1 start}:/app/config/application.toml:ro"
